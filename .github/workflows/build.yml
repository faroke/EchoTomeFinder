# Builds the per-language zips on every push and pull request.
# Pushing a tag vX.Y.Z (matching "## Version: X.Y.Z" in the .toc) also
# publishes a GitHub release with the zips attached.
#
# No setup step: python3 is preinstalled on the runner.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        run: python3 build.py

      - name: Check tag matches .toc version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^## Version: //p' EchoTomeFinder.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match .toc version $version"
            exit 1
          fi

      - name: Upload zips
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: EchoTomeFinder
          path: dist/*.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
